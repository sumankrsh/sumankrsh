# Keeps the "Latest writing" list in README.md in sync with the blog on mukherjeesuman.com.
name: Latest blog posts

on:
  schedule:
    - cron: "30 3 * * *" # daily, 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.mukherjeesuman.com/blog/feed.xml"
          max_post_count: 4
          template: "- [**$title**]($url)<br><sub>$description</sub>$newline"
          tag_post_pre_newline: true # keep the list on its own lines so GitHub renders it as a list
          commit_message: "Update latest blog posts"
