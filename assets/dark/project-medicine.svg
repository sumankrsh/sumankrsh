<svg xmlns="http://www.w3.org/2000/svg" width="490" height="234" viewBox="0 0 490 234" fill="none" role="img"><title>Medicine &amp; Drug Advisor</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><radialGradient id="cg"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="490" height="234" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="489" height="233" rx="18" fill="#13111F" stroke="#2C2752"/><g clip-path="url(#cc)"><circle cx="450" cy="10" r="120" fill="url(#cg)" class="tb" style="animation:breathe 6s ease-in-out infinite"/></g><rect x="0.5" y="0.5" width="489" height="233" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="173 1271" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1444" dur="8s" begin="0s" repeatCount="indefinite"/></rect><path d="M28 26h10a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H28z M28 26v13" stroke="#827CAB" stroke-width="1.5" stroke-linejoin="round"/><text class="mono" x="50" y="38" font-size="12" fill="#827CAB" text-anchor="start" textLength="229.4" lengthAdjust="spacing" >sumankrsh/medicine-drug-advisor</text><text class="serif" x="28" y="82" font-size="26" fill="#F6F4FF">Medicine &amp; Drug Advisor</text><text class="sans" x="28" y="112" font-size="15.5" fill="#B9B2DB">AI-powered medicine database and drug-interaction</text><text class="sans" x="28" y="134" font-size="15.5" fill="#B9B2DB">checker, focused on Indian medicines and mental-health</text><text class="sans" x="28" y="156" font-size="15.5" fill="#B9B2DB">drugs.</text><rect x="28" y="188" width="74.4" height="26" rx="13" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="65.19999999999999" y="205.5" font-size="11.5" fill="#C9BCFF" text-anchor="middle" textLength="50.4" lengthAdjust="spacing" >FastAPI</text><rect x="110.39999999999999" y="188" width="60.0" height="26" rx="13" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="140.39999999999998" y="205.5" font-size="11.5" fill="#C9BCFF" text-anchor="middle" textLength="36.0" lengthAdjust="spacing" >React</text><rect x="178.39999999999998" y="188" width="45.6" height="26" rx="13" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="201.2" y="205.5" font-size="11.5" fill="#C9BCFF" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >RAG</text><g class="nudge"><path d="M442 210 l12 -12 m-8 0 h8 v8" stroke="#8B6CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
