<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="676" viewBox="0 0 1000 676" fill="none" role="img"><title>Selected programmes</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes draw{to{stroke-dashoffset:0}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient></defs><g class="up" style="animation-delay:0.10s"><rect x="0.5" y="0.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="0.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="0.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="36" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="220.4" lengthAdjust="spacing" >INSURANCE · GULF · 2024 → NOW</text><text class="serif" x="26" y="70" font-size="24" fill="#F6F4FF">Enterprise AI transformation</text><text class="sans" x="464" y="68" font-size="30" font-weight="700" letter-spacing="-.5" text-anchor="end" fill="url(#gtext)">~30%</text><text class="mono" x="464" y="86" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="136.0" lengthAdjust="spacing" >LEAD CONVERSION LIFT</text><text class="sans" x="26" y="114" font-size="15" fill="#B9B2DB">A ~$5M Data &amp; AI portfolio: propensity models, GenAI</text><text class="sans" x="26" y="135" font-size="15" fill="#B9B2DB">cross-sell and a customer data platform across 15+ insurance</text><text class="sans" x="26" y="156" font-size="15" fill="#B9B2DB">products. 20+ people across 3 regions.</text><line x1="26" y1="172" x2="464" y2="172" stroke="#2C2752"/><text class="mono" x="26" y="195" font-size="10" fill="#827CAB" text-anchor="start" textLength="252.0" lengthAdjust="spacing" >AZURE ML · DATABRICKS · GENAI · CDP</text></g><g class="up" style="animation-delay:0.20s"><rect x="510.5" y="0.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="510.5" y="0.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="-1.5s" repeatCount="indefinite"/></rect><text class="mono" x="536" y="36" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="167.2" lengthAdjust="spacing" >INSURANCE · GOVERNANCE</text><text class="serif" x="536" y="70" font-size="24" fill="#F6F4FF">AI/ML Centre of Practice</text><path d="M952 24 l18 7 v12 c0 12 -8 19 -18 23 c-10 -4 -18 -11 -18 -23 v-12 z" fill="#8B6CFF" fill-opacity=".14" stroke="url(#gtext)" stroke-width="2" stroke-linejoin="round"/><path d="M945 46 l5 5 l9 -10" stroke="url(#grun)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="24" stroke-dashoffset="24" style="animation:draw .8s 1.2s ease-out forwards"/><text class="mono" x="974" y="86" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="108.8" lengthAdjust="spacing" >GOVERNANCE FIRST</text><text class="sans" x="536" y="114" font-size="15" fill="#B9B2DB">Governance forum, LLMOps standards, Responsible AI</text><text class="sans" x="536" y="135" font-size="15" fill="#B9B2DB">controls and model-risk reviews, plus an agentic AI</text><text class="sans" x="536" y="156" font-size="15" fill="#B9B2DB">underwriting pilot with a human in the loop.</text><line x1="536" y1="172" x2="974" y2="172" stroke="#2C2752"/><text class="mono" x="536" y="195" font-size="10" fill="#827CAB" text-anchor="start" textLength="244.8" lengthAdjust="spacing" >LLMOPS · RESPONSIBLE AI · AZURE AI</text></g><g class="up" style="animation-delay:0.30s"><rect x="0.5" y="232.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="232.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="-3.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="268" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="212.8" lengthAdjust="spacing" >RETAIL · EUROPE &amp; N. AMERICA</text><text class="serif" x="26" y="302" font-size="24" fill="#F6F4FF">Pricing analytics at scale</text><text class="sans" x="464" y="300" font-size="30" font-weight="700" letter-spacing="-.5" text-anchor="end" fill="url(#gtext)">14,000+</text><text class="mono" x="464" y="318" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="40.8" lengthAdjust="spacing" >STORES</text><text class="sans" x="26" y="346" font-size="15" fill="#B9B2DB">Pricing decision support, feature pipelines and ML retraining</text><text class="sans" x="26" y="367" font-size="15" fill="#B9B2DB">at retail scale, including a 100TB+ Azure migration.</text><line x1="26" y1="404" x2="464" y2="404" stroke="#2C2752"/><text class="mono" x="26" y="427" font-size="10" fill="#827CAB" text-anchor="start" textLength="252.0" lengthAdjust="spacing" >AZURE · DATABRICKS · SYNAPSE · ADLS</text></g><g class="up" style="animation-delay:0.40s"><rect x="510.5" y="232.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="510.5" y="232.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="-4.5s" repeatCount="indefinite"/></rect><text class="mono" x="536" y="268" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="190.0" lengthAdjust="spacing" >MEDTECH · 12 APAC MARKETS</text><text class="serif" x="536" y="302" font-size="24" fill="#F6F4FF">Compliance ML</text><text class="sans" x="974" y="300" font-size="30" font-weight="700" letter-spacing="-.5" text-anchor="end" fill="url(#gtext)">70→95%</text><text class="mono" x="974" y="318" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="61.2" lengthAdjust="spacing" >PRECISION</text><text class="sans" x="536" y="346" font-size="15" fill="#B9B2DB">Anomaly detection that surfaces high-risk accounts for</text><text class="sans" x="536" y="367" font-size="15" fill="#B9B2DB">compliance and audit review, with far fewer false positives to</text><text class="sans" x="536" y="388" font-size="15" fill="#B9B2DB">chase.</text><line x1="536" y1="404" x2="974" y2="404" stroke="#2C2752"/><text class="mono" x="536" y="427" font-size="10" fill="#827CAB" text-anchor="start" textLength="273.6" lengthAdjust="spacing" >PYTHON · ANOMALY DETECTION · ENSEMBLES</text></g><g class="up" style="animation-delay:0.50s"><rect x="0.5" y="464.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="464.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="-6.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="500" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="136.8" lengthAdjust="spacing" >FINANCIAL SERVICES</text><text class="serif" x="26" y="534" font-size="24" fill="#F6F4FF">500TB+ AWS migration</text><text class="sans" x="464" y="532" font-size="30" font-weight="700" letter-spacing="-.5" text-anchor="end" fill="url(#gtext)">~$280K</text><text class="mono" x="464" y="550" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="95.2" lengthAdjust="spacing" >SAVED PER YEAR</text><text class="sans" x="26" y="578" font-size="15" fill="#B9B2DB">Delivery governance for a Redshift migration with a controlled</text><text class="sans" x="26" y="599" font-size="15" fill="#B9B2DB">cutover and a foundation for downstream ML workloads.</text><line x1="26" y1="636" x2="464" y2="636" stroke="#2C2752"/><text class="mono" x="26" y="659" font-size="10" fill="#827CAB" text-anchor="start" textLength="172.8" lengthAdjust="spacing" >REDSHIFT · GLUE · ATHENA</text></g><g class="up" style="animation-delay:0.60s"><rect x="510.5" y="464.5" width="489" height="211" rx="18" fill="#13111F" stroke="#2C2752"/><rect x="510.5" y="464.5" width="489" height="211" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="168 1232" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1400" dur="9s" begin="-7.5s" repeatCount="indefinite"/></rect><text class="mono" x="536" y="500" font-size="10.5" fill="#8B6CFF" text-anchor="start" textLength="144.4" lengthAdjust="spacing" >INSURANCE · EARLIER</text><text class="serif" x="536" y="534" font-size="24" fill="#F6F4FF">AML detection &amp; reporting</text><text class="sans" x="974" y="532" font-size="30" font-weight="700" letter-spacing="-.5" text-anchor="end" fill="url(#gtext)">~80%</text><text class="mono" x="974" y="550" font-size="9.5" fill="#827CAB" text-anchor="end" textLength="108.8" lengthAdjust="spacing" >FASTER REPORTING</text><text class="sans" x="536" y="578" font-size="15" fill="#B9B2DB">An AML model that flags high-risk entities earlier, and</text><text class="sans" x="536" y="599" font-size="15" fill="#B9B2DB">industrialised Power BI reporting for 200+ users.</text><line x1="536" y1="636" x2="974" y2="636" stroke="#2C2752"/><text class="mono" x="536" y="659" font-size="10" fill="#827CAB" text-anchor="start" textLength="216.0" lengthAdjust="spacing" >DATABRICKS · POWER BI · PYTHON</text></g></svg>
