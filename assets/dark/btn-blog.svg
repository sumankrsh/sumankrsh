<svg xmlns="http://www.w3.org/2000/svg" width="172" height="54" viewBox="0 0 172 54" fill="none" role="img"><title>Read the blog: AI in production</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.nudge{animation:nudge 2.2s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="bb" x1="0" x2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#5B3DF5"/></linearGradient></defs><rect x=".75" y=".75" width="170.5" height="52.5" rx="14" fill="#13111F" stroke="#2C2752" stroke-width="1.5"/><rect x="0.75" y="0.75" width="170.5" height="52.5" rx="14" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="54 392" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-446" dur="6s" begin="0s" repeatCount="indefinite"/></rect><text class="sans" x="18" y="24" font-size="15" font-weight="600" fill="#F6F4FF">Read the blog</text><text class="mono" x="18" y="41" font-size="10" fill="#827CAB" text-anchor="start" textLength="108.8" lengthAdjust="spacing" >AI in production</text><g class="nudge"><path d="M142 32.0 l9 -9 m-6 0 h6 v6" stroke="#F6F4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
