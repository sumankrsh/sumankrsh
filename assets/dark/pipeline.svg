<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img"><title>How I take AI from POC to P&amp;L: the demo, the data, guardrails, production, P&amp;L</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
