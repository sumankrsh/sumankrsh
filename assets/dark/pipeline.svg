t class="serif" x="305" y="148" font-size="23" text-anchor="middle" fill="#F6F4FF">The data</text><text class="sans" x="305" y="176" font-size="14" text-anchor="middle" fill="#B9B2DB">Profiling, DQ checks,</text><text class="sans" x="305" y="196" font-size="14" text-anchor="middle" fill="#B9B2DB">entity resolution first.</text></g><g class="up" style="animation-delay:0.39s"><circle cx="500" cy="82" r="30" fill="#13111F" stroke="#2C2752" stroke-width="1.5"/><circle cx="500" cy="82" r="30" stroke="#8B6CFF" stroke-width="2.2" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.355;0.375;0.515;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="500" cy="82" r="30" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.355;0.375;0.515;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="500" y="87" font-size="14" fill="#8B6CFF" text-anchor="middle" textLength="16.8" lengthAdjust="spacing" >03</text><text class="serif" x="500" y="148" font-size="23" text-anchor="middle" fill="#F6F4FF">Guardrails</text><text class="sans" x="500" y="176" font-size="14" text-anchor="middle" fill="#B9B2DB">Responsible AI, model risk,</text><text class="sans" x="500" y="196" font-size="14" text-anchor="middle" fill="#B9B2DB">human in the loop.</text></g><g class="up" style="animation-delay:0.51s"><circle cx="695" cy="82" r="30" fill="#13111F" stroke="#2C2752" stroke-width="1.5"/><circle cx="695" cy="82" r="30" stroke="#8B6CFF" stroke-width="2.2" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.542;0.562;0.703;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="695" cy="82" r="30" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.542;0.562;0.703;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="695" y="87" font-size="14" fill="#8B6CFF" text-anchor="middle" textLength="16.8" lengthAdjust="spacing" >04</text><text class="serif" x="695" y="148" font-size="23" text-anchor="middle" fill="#F6F4FF">Production</text><text class="sans" x="695" y="176" font-size="14" text-anchor="middle" fill="#B9B2DB">Governed, audited, owned.</text><text class="sans" x="695" y="196" font-size="14" text-anchor="middle" fill="#B9B2DB">LLMOps &amp; MLOps in place.</text></g><g class="up" style="animation-delay:0.63s"><circle cx="890" cy="82" r="30" fill="#13111F" stroke="#2C2752" stroke-width="1.5"/><circle cx="890" cy="82" r="30" stroke="#FFB39A" stroke-width="2.2" opacity="0.9"></circle><circle cx="890" cy="82" r="30" fill="#FFB39A" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.730;0.750;0.890;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="890" y="87" font-size="14" fill="#FFB39A" text-anchor="middle" textLength="16.8" lengthAdjust="spacing" >05</text><text class="serif" x="890" y="148" font-size="23" text-anchor="middle" fill="#F6F4FF" font-style="italic">P&amp;L</text><text class="sans" x="890" y="176" font-size="14" text-anchor="middle" fill="#B9B2DB">Measured in conversion,</text><text class="sans" x="890" y="196" font-size="14" text-anchor="middle" fill="#B9B2DB">retention and run-cost.</text></g></svg>
