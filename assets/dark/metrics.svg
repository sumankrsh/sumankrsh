<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="168" viewBox="0 0 1000 168" fill="none" role="img"><title>12+ years in AI and data · $5M portfolio owned · ~30% lead conversion lift · 500TB+ cloud data migrated</title><style>
