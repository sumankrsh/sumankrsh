<svg xmlns="http://www.w3.org/2000/svg" width="490" height="234" viewBox="0 0 490 234" fill="none" role="img"><title>Ask-me-anything portfolio</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B3DF5"/><stop offset="1" stop-color="#E8775A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B3DF5"/><stop offset="1" stop-color="#E8775A"/></linearGradient><radialGradient id="cg"><stop offset="0" stop-color="#5B3DF5" stop-opacity=".35"/><stop offset="1" stop-color="#5B3DF5" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="490" height="234" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="489" height="233" rx="18" fill="#FFFFFF" stroke="#E1DAF2"/><g clip-path="url(#cc)"><circle cx="450" cy="10" r="120" fill="url(#cg)" class="tb" style="animation:breathe 6s ease-in-out infinite"/></g><rect x="0.5" y="0.5" width="489" height="233" rx="18" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="173 1271" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1444" dur="8s" begin="0s" repeatCount="indefinite"/></rect><path d="M28 26h10a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H28z M28 26v13" stroke="#7D7797" stroke-width="1.5" stroke-linejoin="round"/><text class="mono" x="50" y="38" font-size="12" fill="#7D7797" text-anchor="start" textLength="133.2" lengthAdjust="spacing" >mukherjeesuman.com</text><rect x="398.8" y="21" width="67.2" height="24" rx="12" fill="#F8F5FF" stroke="#E1DAF2"/><circle cx="413.8" cy="33" r="3.5" fill="#059669"/><circle cx="413.8" cy="33" r="3.5" fill="#059669" class="tb ping"/><text class="mono" x="424.8" y="37" font-size="11" fill="#15121F" text-anchor="start" textLength="31.2" lengthAdjust="spacing" >LIVE</text><text class="serif" x="28" y="82" font-size="26" fill="#15121F">Ask-me-anything portfolio</text><text class="sans" x="28" y="112" font-size="15.5" fill="#4B4563">A live answer engine grounded in my real work, a role-fit</text><text class="sans" x="28" y="134" font-size="15.5" fill="#4B4563">check that runs in your browser, and a scroll-driven film.</text><rect x="28" y="188" width="74.4" height="26" rx="13" fill="#F8F5FF" stroke="#E1DAF2"/><text class="mono" x="65.19999999999999" y="205.5" font-size="11.5" fill="#5B3DF5" text-anchor="middle" textLength="50.4" lengthAdjust="spacing" >LLM Q&amp;A</text><rect x="110.39999999999999" y="188" width="139.2" height="26" rx="13" fill="#F8F5FF" stroke="#E1DAF2"/><text class="mono" x="180.0" y="205.5" font-size="11.5" fill="#5B3DF5" text-anchor="middle" textLength="115.2" lengthAdjust="spacing" >Grounded answers</text><rect x="257.59999999999997" y="188" width="67.2" height="26" rx="13" fill="#F8F5FF" stroke="#E1DAF2"/><text class="mono" x="291.19999999999993" y="205.5" font-size="11.5" fill="#5B3DF5" text-anchor="middle" textLength="43.2" lengthAdjust="spacing" >Vercel</text><g class="nudge"><path d="M442 210 l12 -12 m-8 0 h8 v8" stroke="#5B3DF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
