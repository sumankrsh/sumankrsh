<svg xmlns="http://www.w3.org/2000/svg" width="600" height="2150" viewBox="0 0 600 2150" fill="none" role="img"><title>Selected programmes</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes draw{to{stroke-dashoffset:0}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient></defs><g class="up" style="animation-delay:0.10s"><rect x=".5" y="0.5" width="599" height="363" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="0.5" width="599" height="363" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="231 1693" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1924" dur="9s" begin="0.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="46" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="287.1" lengthAdjust="spacing" >INSURANCE · GULF · 2024 → NOW</text><text class="sans" x="574" y="64" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end" fill="url(#gtext)">~30%</text><text class="mono" x="574" y="92" font-size="13" fill="#827CAB" text-anchor="end" textLength="176.0" lengthAdjust="spacing" >LEAD CONVERSION LIFT</text><text class="serif" x="26" y="138" font-size="33" fill="#F6F4FF">Enterprise AI transformation</text><text class="sans" x="26" y="180" font-size="23" fill="#B9B2DB">A ~$5M Data &amp; AI portfolio: propensity</text><text class="sans" x="26" y="211" font-size="23" fill="#B9B2DB">models, GenAI cross-sell and a customer</text><text class="sans" x="26" y="242" font-size="23" fill="#B9B2DB">data platform across 15+ insurance products.</text><text class="sans" x="26" y="273" font-size="23" fill="#B9B2DB">20+ people across 3 regions.</text><line x1="26" y1="314" x2="574" y2="314" stroke="#2C2752"/><text class="mono" x="26" y="344" font-size="14" fill="#827CAB" text-anchor="start" textLength="329.0" lengthAdjust="spacing" >AZURE ML · DATABRICKS · GENAI · CDP</text></g><g class="up" style="animation-delay:0.18s"><rect x=".5" y="382.5" width="599" height="363" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="382.5" width="599" height="363" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="231 1693" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1924" dur="9s" begin="-1.5s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="428" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="217.8" lengthAdjust="spacing" >INSURANCE · GOVERNANCE</text><path d="M548 400 l22 8 v14 c0 14 -10 22 -22 27 c-12 -5 -22 -13 -22 -27 v-14 z" fill="#8B6CFF" fill-opacity=".14" stroke="url(#gtext)" stroke-width="2.4" stroke-linejoin="round"/><path d="M539 426 l6 6 l11 -12" stroke="url(#grun)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="30" style="animation:draw .8s 1.2s ease-out forwards"/><text class="mono" x="574" y="474" font-size="13" fill="#827CAB" text-anchor="end" textLength="140.8" lengthAdjust="spacing" >GOVERNANCE FIRST</text><text class="serif" x="26" y="520" font-size="33" fill="#F6F4FF">AI/ML Centre of Practice</text><text class="sans" x="26" y="562" font-size="23" fill="#B9B2DB">Governance forum, LLMOps standards,</text><text class="sans" x="26" y="593" font-size="23" fill="#B9B2DB">Responsible AI controls and model-risk</text><text class="sans" x="26" y="624" font-size="23" fill="#B9B2DB">reviews, plus an agentic AI underwriting pilot</text><text class="sans" x="26" y="655" font-size="23" fill="#B9B2DB">with a human in the loop.</text><line x1="26" y1="696" x2="574" y2="696" stroke="#2C2752"/><text class="mono" x="26" y="726" font-size="14" fill="#827CAB" text-anchor="start" textLength="319.6" lengthAdjust="spacing" >LLMOPS · RESPONSIBLE AI · AZURE AI</text></g><g class="up" style="animation-delay:0.26s"><rect x=".5" y="764.5" width="599" height="332" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="764.5" width="599" height="332" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="223 1639" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1862" dur="9s" begin="-3.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="810" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="277.2" lengthAdjust="spacing" >RETAIL · EUROPE &amp; N. AMERICA</text><text class="sans" x="574" y="828" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end" fill="url(#gtext)">14,000+</text><text class="mono" x="574" y="856" font-size="13" fill="#827CAB" text-anchor="end" textLength="52.8" lengthAdjust="spacing" >STORES</text><text class="serif" x="26" y="902" font-size="33" fill="#F6F4FF">Pricing analytics at scale</text><text class="sans" x="26" y="944" font-size="23" fill="#B9B2DB">Pricing decision support, feature pipelines</text><text class="sans" x="26" y="975" font-size="23" fill="#B9B2DB">and ML retraining at retail scale, including a</text><text class="sans" x="26" y="1006" font-size="23" fill="#B9B2DB">100TB+ Azure migration.</text><line x1="26" y1="1047" x2="574" y2="1047" stroke="#2C2752"/><text class="mono" x="26" y="1077" font-size="14" fill="#827CAB" text-anchor="start" textLength="329.0" lengthAdjust="spacing" >AZURE · DATABRICKS · SYNAPSE · ADLS</text></g><g class="up" style="animation-delay:0.34s"><rect x=".5" y="1115.5" width="599" height="332" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="1115.5" width="599" height="332" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="223 1639" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1862" dur="9s" begin="-4.5s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="1161" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="247.5" lengthAdjust="spacing" >MEDTECH · 12 APAC MARKETS</text><text class="sans" x="574" y="1179" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end" fill="url(#gtext)">70→95%</text><text class="mono" x="574" y="1207" font-size="13" fill="#827CAB" text-anchor="end" textLength="79.2" lengthAdjust="spacing" >PRECISION</text><text class="serif" x="26" y="1253" font-size="33" fill="#F6F4FF">Compliance ML</text><text class="sans" x="26" y="1295" font-size="23" fill="#B9B2DB">Anomaly detection that surfaces high-risk</text><text class="sans" x="26" y="1326" font-size="23" fill="#B9B2DB">accounts for compliance and audit review,</text><text class="sans" x="26" y="1357" font-size="23" fill="#B9B2DB">with far fewer false positives to chase.</text><line x1="26" y1="1398" x2="574" y2="1398" stroke="#2C2752"/><text class="mono" x="26" y="1428" font-size="14" fill="#827CAB" text-anchor="start" textLength="357.2" lengthAdjust="spacing" >PYTHON · ANOMALY DETECTION · ENSEMBLES</text></g><g class="up" style="animation-delay:0.42s"><rect x=".5" y="1466.5" width="599" height="332" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="1466.5" width="599" height="332" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="223 1639" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1862" dur="9s" begin="-6.0s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="1512" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="178.2" lengthAdjust="spacing" >FINANCIAL SERVICES</text><text class="sans" x="574" y="1530" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end" fill="url(#gtext)">~$280K</text><text class="mono" x="574" y="1558" font-size="13" fill="#827CAB" text-anchor="end" textLength="123.2" lengthAdjust="spacing" >SAVED PER YEAR</text><text class="serif" x="26" y="1604" font-size="33" fill="#F6F4FF">500TB+ AWS migration</text><text class="sans" x="26" y="1646" font-size="23" fill="#B9B2DB">Delivery governance for a Redshift migration</text><text class="sans" x="26" y="1677" font-size="23" fill="#B9B2DB">with a controlled cutover and a foundation for</text><text class="sans" x="26" y="1708" font-size="23" fill="#B9B2DB">downstream ML workloads.</text><line x1="26" y1="1749" x2="574" y2="1749" stroke="#2C2752"/><text class="mono" x="26" y="1779" font-size="14" fill="#827CAB" text-anchor="start" textLength="225.6" lengthAdjust="spacing" >REDSHIFT · GLUE · ATHENA</text></g><g class="up" style="animation-delay:0.50s"><rect x=".5" y="1817.5" width="599" height="332" rx="20" fill="#13111F" stroke="#2C2752"/><rect x="0.5" y="1817.5" width="599" height="332" rx="20" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="223 1639" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1862" dur="9s" begin="-7.5s" repeatCount="indefinite"/></rect><text class="mono" x="26" y="1863" font-size="14.5" fill="#8B6CFF" text-anchor="start" textLength="188.1" lengthAdjust="spacing" >INSURANCE · EARLIER</text><text class="sans" x="574" y="1881" font-size="44" font-weight="700" letter-spacing="-1" text-anchor="end" fill="url(#gtext)">~80%</text><text class="mono" x="574" y="1909" font-size="13" fill="#827CAB" text-anchor="end" textLength="140.8" lengthAdjust="spacing" >FASTER REPORTING</text><text class="serif" x="26" y="1955" font-size="33" fill="#F6F4FF">AML detection &amp; reporting</text><text class="sans" x="26" y="1997" font-size="23" fill="#B9B2DB">An AML model that flags high-risk entities</text><text class="sans" x="26" y="2028" font-size="23" fill="#B9B2DB">earlier, and industrialised Power BI reporting</text><text class="sans" x="26" y="2059" font-size="23" fill="#B9B2DB">for 200+ users.</text><line x1="26" y1="2100" x2="574" y2="2100" stroke="#2C2752"/><text class="mono" x="26" y="2130" font-size="14" fill="#827CAB" text-anchor="start" textLength="282.0" lengthAdjust="spacing" >DATABRICKS · POWER BI · PYTHON</text></g></svg>
