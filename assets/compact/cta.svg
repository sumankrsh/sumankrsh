<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" fill="none" role="img"><title>Have an AI programme in mind? Let's talk.</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.97)}50%{opacity:.75;transform:scale(1.03)}}.nudge{animation:nudge 1.8s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><clipPath id="cc"><rect width="600" height="520" rx="22"/></clipPath><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0913"/><stop offset="1" stop-color="#151034"/></linearGradient><filter id="cb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter><pattern id="cp" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF"/></pattern><radialGradient id="cm" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="ck"><rect width="600" height="520" fill="url(#cm)"/></mask><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#5B3DF5"/></linearGradient><filter id="bglow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter></defs><g clip-path="url(#cc)"><rect width="600" height="520" fill="url(#cg)"/><g filter="url(#cb)" opacity=".55"><circle cx="84" cy="52" r="170" fill="#8B6CFF" style="animation:d1 18s ease-in-out infinite alternate"/><circle cx="516" cy="510" r="190" fill="#FFB39A" opacity=".7" style="animation:d2 22s ease-in-out infinite alternate"/><circle cx="336" cy="-26" r="140" fill="#5B3DF5" style="animation:d3 26s ease-in-out infinite alternate"/></g><rect width="600" height="520" fill="url(#cp)" opacity=".07" mask="url(#ck)"/></g><rect x=".5" y=".5" width="599" height="519" rx="22" stroke="#2C2752"/><g class="fade"><path d="M44 49 C45.05 54.95 45.05 54.95 51 56 C45.05 57.05 45.05 57.05 44 63 C42.95 57.05 42.95 57.05 37 56 C42.95 54.95 42.95 54.95 44 49Z" fill="#8B6CFF"/><text class="mono" x="60" y="62" font-size="15" fill="#C9BCFF" text-anchor="start" textLength="220.0" lengthAdjust="spacing" >START A CONVERSATION</text></g><text class="serif up" x="36" y="128" font-size="46" fill="#F6F4FF" textLength="483" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.10s">Have an AI programme</text><text class="serif up" x="36" y="180" font-size="46" fill="#F6F4FF" textLength="181" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.18s">in mind?</text><text class="serif up" x="36" y="236" font-size="46" fill="url(#gtext)" font-style="italic" textLength="184" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.26s">Let's talk.</text><text class="sans up" x="36" y="290" font-size="23" fill="#B9B2DB" style="animation-delay:0.30s">AI transformation · GenAI &amp; agentic</text><text class="sans up" x="36" y="323" font-size="23" fill="#B9B2DB" style="animation-delay:0.35s">delivery · AI governance · advisory.</text><text class="sans up" x="36" y="356" font-size="23" fill="#B9B2DB" style="animation-delay:0.40s">I reply within 24 hours.</text><g class="up" style="animation-delay:.45s"><rect x="36" y="388" width="528" height="72" rx="36" fill="#8B6CFF" filter="url(#bglow)" class="tb" style="animation:glow 2.8s ease-in-out infinite"/><rect x="36" y="388" width="528" height="72" rx="36" fill="url(#bg)"/><text class="sans" x="282.0" y="433" font-size="27" font-weight="600" fill="#fff" text-anchor="middle">Ask my AI anything</text><g class="nudge"><path d="M472 424 h22 m-8 -8 l8 8 l-8 8" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="mono" x="300.0" y="498" font-size="16" fill="#827CAB" text-anchor="middle" textLength="190.8" lengthAdjust="spacing" >mukherjeesuman.com</text></g></svg>
