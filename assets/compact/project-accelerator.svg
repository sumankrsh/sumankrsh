<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" fill="none" role="img"><title>AI-Accelerator Toolkit</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.tb{transform-box:fill-box;transform-origin:center}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1s ease both}
.float{animation:float 6s ease-in-out infinite}
.blink{animation:blink 1.05s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.ping{animation:ping 3.2s cubic-bezier(.2,.6,.3,1) infinite}
.spin{animation:spin 40s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-16}}
@keyframes ping{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes d1{0%{transform:translate(0,0)}100%{transform:translate(70px,40px)}}
@keyframes d2{0%{transform:translate(0,0)}100%{transform:translate(-80px,-30px)}}
@keyframes d3{0%{transform:translate(0,0)}100%{transform:translate(40px,50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.15);opacity:1}}</style><defs><linearGradient id="gtext" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9A8FF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><linearGradient id="grun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B6CFF"/><stop offset="1" stop-color="#FFB39A"/></linearGradient><radialGradient id="cg"><stop offset="0" stop-color="#8B6CFF" stop-opacity=".35"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="480" height="520" rx="26"/></clipPath></defs><rect x=".75" y=".75" width="478.5" height="518.5" rx="26" fill="#13111F" stroke="#2C2752" stroke-width="1.5"/><g clip-path="url(#cc)"><circle cx="430" cy="20" r="170" fill="url(#cg)" class="tb" style="animation:breathe 6s ease-in-out infinite"/></g><rect x="0.75" y="0.75" width="478.5" height="518.5" rx="26" stroke="url(#grun)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="239 1755" opacity=".95"><animate attributeName="stroke-dashoffset" from="0" to="-1994" dur="8s" begin="0s" repeatCount="indefinite"/></rect><text class="mono" x="30" y="58" font-size="21" fill="#827CAB" text-anchor="start" textLength="281.6" lengthAdjust="spacing" >ai-accelerator-toolkit</text><text class="serif" x="30" y="132" font-size="46" fill="#F6F4FF">AI-Accelerator</text><text class="serif" x="30" y="184" font-size="46" fill="#F6F4FF">Toolkit</text><text class="sans" x="30" y="248" font-size="36" fill="#B9B2DB">AI readiness, cloud</text><text class="sans" x="30" y="294" font-size="36" fill="#B9B2DB">blueprints and ROI.</text><rect x="30" y="380" width="123.6" height="48" rx="24" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="91.8" y="412" font-size="24" fill="#C9BCFF" text-anchor="middle" textLength="87.6" lengthAdjust="spacing" >Python</text><rect x="165.6" y="380" width="167.4" height="48" rx="24" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="249.29999999999998" y="412" font-size="24" fill="#C9BCFF" text-anchor="middle" textLength="131.4" lengthAdjust="spacing" >Streamlit</text><rect x="30" y="438" width="109.0" height="48" rx="24" fill="#1A1630" stroke="#2C2752"/><text class="mono" x="84.5" y="470" font-size="24" fill="#C9BCFF" text-anchor="middle" textLength="73.0" lengthAdjust="spacing" >GenAI</text></svg>
