<svg xmlns="http://www.w3.org/2000/svg" width="600" height="706" viewBox="0 0 600 706" fill="none" role="img"><title>How I take AI from POC to P&amp;L: the demo, the data, guardrails, production, P&amp;L</title><style>
.serif{font-family:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif}
