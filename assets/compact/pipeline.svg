ect x="71.5" y="-46" width="5" height="120" rx="2.5" fill="url(#comet)"><animateTransform attributeName="transform" type="translate" values="0 0;0 528;0 528" keyTimes="0;0.750;1" dur="6.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.750;0.812;1" dur="6.4s" repeatCount="indefinite"/></rect><g class="up" style="animation-delay:0.15s"><circle cx="74" cy="74" r="36" fill="#13111F" stroke="#2C2752" stroke-width="1.8"/><circle cx="74" cy="74" r="36" stroke="#8B6CFF" stroke-width="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.001;0.000;0.140;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="74" cy="74" r="36" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.001;0.000;0.140;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="74" y="80.5" font-size="18" fill="#8B6CFF" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >01</text><text class="serif" x="138" y="66" font-size="32" fill="#F6F4FF">The demo</text><text class="sans" x="138" y="98" font-size="21" fill="#B9B2DB">Most AI dies as a POC.</text><text class="sans" x="138" y="124" font-size="21" fill="#B9B2DB">Start from the problem.</text></g><g class="up" style="animation-delay:0.27s"><circle cx="74" cy="206" r="36" fill="#13111F" stroke="#2C2752" stroke-width="1.8"/><circle cx="74" cy="206" r="36" stroke="#8B6CFF" stroke-width="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.167;0.187;0.328;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="74" cy="206" r="36" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.167;0.187;0.328;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="74" y="212.5" font-size="18" fill="#8B6CFF" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >02</text><text class="serif" x="138" y="198" font-size="32" fill="#F6F4FF">The data</text><text class="sans" x="138" y="230" font-size="21" fill="#B9B2DB">Profiling, DQ checks,</text><text class="sans" x="138" y="256" font-size="21" fill="#B9B2DB">entity resolution first.</text></g><g class="up" style="animation-delay:0.39s"><circle cx="74" cy="338" r="36" fill="#13111F" stroke="#2C2752" stroke-width="1.8"/><circle cx="74" cy="338" r="36" stroke="#8B6CFF" stroke-width="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.355;0.375;0.515;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="74" cy="338" r="36" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.355;0.375;0.515;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="74" y="344.5" font-size="18" fill="#8B6CFF" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >03</text><text class="serif" x="138" y="330" font-size="32" fill="#F6F4FF">Guardrails</text><text class="sans" x="138" y="362" font-size="21" fill="#B9B2DB">Responsible AI, model risk,</text><text class="sans" x="138" y="388" font-size="21" fill="#B9B2DB">human in the loop.</text></g><g class="up" style="animation-delay:0.51s"><circle cx="74" cy="470" r="36" fill="#13111F" stroke="#2C2752" stroke-width="1.8"/><circle cx="74" cy="470" r="36" stroke="#8B6CFF" stroke-width="2.6" opacity="0"><animate attributeName="opacity" values="0;0;1;.15;0" keyTimes="0;0.542;0.562;0.703;1" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="74" cy="470" r="36" fill="#8B6CFF" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.542;0.562;0.703;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="74" y="476.5" font-size="18" fill="#8B6CFF" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >04</text><text class="serif" x="138" y="462" font-size="32" fill="#F6F4FF">Production</text><text class="sans" x="138" y="494" font-size="21" fill="#B9B2DB">Governed, audited, owned.</text><text class="sans" x="138" y="520" font-size="21" fill="#B9B2DB">LLMOps &amp; MLOps in place.</text></g><g class="up" style="animation-delay:0.63s"><circle cx="74" cy="602" r="36" fill="#13111F" stroke="#2C2752" stroke-width="1.8"/><circle cx="74" cy="602" r="36" stroke="#FFB39A" stroke-width="2.6" opacity="0.9"></circle><circle cx="74" cy="602" r="36" fill="#FFB39A" opacity="0"><animate attributeName="opacity" values="0;0;.28;0;0" keyTimes="0;0.730;0.750;0.890;1" dur="6.4s" repeatCount="indefinite"/></circle><text class="mono" x="74" y="608.5" font-size="18" fill="#FFB39A" text-anchor="middle" textLength="21.6" lengthAdjust="spacing" >05</text><text class="serif" x="138" y="594" font-size="32" fill="#F6F4FF" font-style="italic">P&amp;L</text><text class="sans" x="138" y="626" font-size="21" fill="#B9B2DB">Measured in conversion,</text><text class="sans" x="138" y="652" font-size="21" fill="#B9B2DB">retention and run-cost.</text></g></svg>
